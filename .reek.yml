# Reek runs with its default smells on lib/ and bin/. Any suppression added
# here must say why, and is also listed in docs/exceptions.md.
---
exclude_paths:
  - build

detectors:
  UtilityFunction:
    exclude:
      # The FFI adapters: each method is one call into the C shim, which owns
      # the window and font state. Holding state here would duplicate it.
      - "Shipinel::Screen"
      - "Shipinel::FontShim"
      # The same for the tray icon (ext/tray.c), and the window's visibility;
      # AbsentTray stands in for it, doing nothing, when there is no tray.
      - "Shipinel::Tray"
      - "Shipinel::AbsentTray"
      # The same for the fc-match process: FontLocator takes a fake in tests.
      - "Shipinel::Fontconfig"
  FeatureEnvy:
    exclude:
      # Dispatch on the block's kind: Spinel cannot pass a block narrowed by
      # is_a? to a method typed with its subclass (docs/spinel-notes.md), so
      # each branch reads that kind's fields here. Painter#draw is the same
      # dispatch over draw commands.
      - "Shipinel::Layout#place_kind"
      - "Shipinel::Painter#draw"
  DuplicateMethodCall:
    exclude:
      # The same dispatch: `block.depth` is read in two exclusive branches.
      - "Shipinel::Layout#place_kind"
