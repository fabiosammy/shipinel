name: 20 · Release

# Step 20: run by hand from the Actions tab, on main, once "10 · Validate"
# passed there with the new version in flake.nix, spin.toml and version.rb
# (CONTRIBUTING.md, Releases). Runs every gate again, builds the package,
# and creates the GitHub Release v<version>, with notes listing the commits
# since the previous tag by type (`rake release_notes`) and how to install
# that version.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The whole history and the tags, for the notes' "since the last tag".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'gemset.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # One number in flake.nix, spin.toml and lib/shipinel/version.rb;
      # `rake check` fails when they differ, and the gate below runs it.
      - name: Read the version
        id: version
        run: echo "version=$(nix develop --command rake --silent version)" >> "$GITHUB_OUTPUT"

      # A version is released once.
      - name: Refuse an already released version
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "::error::$TAG is already released. Bump the version first (CONTRIBUTING.md, Releases)."
            exit 1
          fi

      - name: Every quality gate (rake check)
        run: nix flake check --print-build-logs

      - name: Build the package
        run: nix build --print-build-logs

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          nix develop --command rake --silent "release_notes[$TAG]" > notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md
