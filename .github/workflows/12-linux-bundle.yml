name: 12 · Linux bundle

# Step 12: builds Shipinel for people without Nix (packaging/linux/build.sh)
# on the oldest system it supports, Ubuntu 22.04: one executable with
# raylib and GLFW inside, and a tarball with the desktop entry and icon.
# Checks that it starts, runs the window test (test/window/run.sh) on it,
# and keeps both, with SHA256SUMS, as an artifact. Called by "10 · Validate" on every
# pull request and by "20 · Release", which attaches it to the release.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Spinel's build runs a Ruby script; Ubuntu 22.04's Ruby is 3.0.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake pkg-config libcrypt-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl-dev libegl-dev libsystemd-dev

      - name: Build the bundle
        run: packaging/linux/build.sh "$RUNNER_TEMP/bundle"

      # The window test needs a display and a software OpenGL driver; the
      # fonts are what a desktop would have.
      - name: Window test dependencies
        run: |
          sudo apt-get install --yes --no-install-recommends \
            xvfb xdotool libgl1-mesa-dri fontconfig fonts-dejavu-core

      # The single file links nothing from the build but the system's
      # glibc, libm, libsystemd and libX11.
      - name: The executable starts and knows its version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' spin.toml)
          single=$RUNNER_TEMP/bundle/shipinel-linux-x86_64
          test "$("$single" --version)" = "shipinel $version"
          ldd "$single"
          echo "SINGLE=$single" >> "$GITHUB_ENV"

      - name: Window test
        run: test/window/run.sh "$SINGLE"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: |
            ${{ runner.temp }}/bundle/shipinel-linux-x86_64
            ${{ runner.temp }}/bundle/shipinel-linux-x86_64.tar.gz
            ${{ runner.temp }}/bundle/SHA256SUMS
          if-no-files-found: error
