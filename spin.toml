# spin manifest. The C shim and the tray are the carried C; raylib's, GLFW's
# and libsystemd's include flags come from pkg-config, and ui.rb's ffi_lib
# links them.
[package]
name = "shipinel"
version = "0.4.0"
sources = ["ext/ui_shim.c", "ext/tray.c"]

[native]
pkg_config = ["raylib", "glfw3", "libsystemd"]
